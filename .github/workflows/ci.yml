name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: the workflow only checks out code and runs tests.
permissions:
  contents: read

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest version allowed by requires-python (resolves pandas 2.x) and newest (pandas 3.x).
        python-version: ["3.10", "3.14"]

    steps:
      # Actions are pinned to full commit SHAs; the comment records the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          # The app extra (Streamlit) is installed so the web-app UI tests run instead of being skipped, and the
          # ai extra (Anthropic SDK) so the provider tests run against the real SDK. No test calls the API.
          python -m pip install -e ".[dev,app,ai]"

      - name: Run tests
        env:
          # The real-SDK tests in tests/test_ai.py fail instead of skipping if the ai extra cannot be imported.
          OPSRESOLVE_REQUIRE_AI_SDK_TESTS: "1"
        run: python -m pytest

      # Prints precision/recall/F1 on the synthetic evaluation dataset to the log and the run summary.
      # pytest (tests/test_evaluation.py) is what gates on the measured results.
      - name: Run evaluation
        run: python -m opsresolve.evaluation --output "$GITHUB_STEP_SUMMARY"
